name: Build Windows exe

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller==6.11.1
      - name: Build
        run: python build.py
      - name: Smoke test
        run: |
          $p = Start-Process -FilePath dist\FloatControl.exe -PassThru
          Start-Sleep -Seconds 8
          if ($p.HasExited) { throw "FloatControl exited early with code $($p.ExitCode)" }
          Stop-Process -Id $p.Id
      - uses: actions/upload-artifact@v4
        with:
          name: FloatControl-windows
          path: dist/FloatControl-*.exe
